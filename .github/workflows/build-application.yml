# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Build application"

on:
    push:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "*.py"
            - "*.spec"
    pull_request:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "*.py"
            - "*.spec"

defaults:
    run:
        shell: pwsh

jobs:
    build-application:
        name: 'Build application'

        strategy:
            matrix:
                system:
                    - ubuntu-24.04

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.10'

            - name: Build modules
              run: |
                  python `
                      -m compileall `
                      -q `
                          ${{ github.workspace }}/src `
                          ${{ github.workspace }}/prep_assets.py
                  python `
                      -m py_compile `
                      ${{ github.workspace }}/src/geneograph_voix/geneograph_voix.spec

    publish-application:
        name: "Publish application"

        needs:
            - build-application

        strategy:
            matrix:
                system:
                    - ubuntu-24.04

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.10'

            - name: Cache dependencies
              uses: actions/cache@v6
              with:
                  key: Application-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
                  restore-keys: |
                      Application-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
                      Application-${{ hashFiles('**/requirements*.txt') }}
                      Application-
                  path: |
                      .pip/

            - name: Setup dependencies
              run: |
                  pip install `
                      -r ${{ github.workspace }}/requirements.txt `
                      --cache-dir ${{ github.workspace }}/.pip
                  pip install `
                      -r ${{ github.workspace }}/src/geneograph_voix/requirements.txt `
                      --cache-dir ${{ github.workspace }}/.pip
                  pip install `
                      -r ${{ github.workspace }}/src/geneograph_voix/requirements_cuda.txt `
                      --cache-dir ${{ github.workspace }}/.pip

            - name: Pack application
              run: |
                  pyinstaller `
                      ${{ github.workspace }}/src/geneograph_voix/geneograph_voix.spec

            - name: Upload cache
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-cache-${{ matrix.system }}-${{ github.sha }}
                  path: |
                      ${{ github.workspace }}/.pip/
                  overwrite: true

            - name: Upload application
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-build-${{ matrix.system }}-${{ github.sha }}
                  path: |
                      ${{ github.workspace }}/dist/geneograph_voix/
